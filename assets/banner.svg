<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f0c20"/><stop offset="50%" stop-color="#15102a"/><stop offset="100%" stop-color="#06040a"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="neonPink" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ff0844"/><stop offset="100%" stop-color="#ffb199"/></linearGradient><linearGradient id="purpleGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7f00ff"/><stop offset="100%" stop-color="#e100ff"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowPink" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatPulse1{0%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(30px,-20px) scale(1.1);opacity:.6}}@keyframes floatPulse2{0%{transform:translate(0,0) scale(1);opacity:.25}50%{transform:translate(-25px,25px) scale(1.15);opacity:.55}}@keyframes gridSlide{0%{transform:translateY(0)}}@keyframes controllerFloat{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes scanline{0%{transform:translateY(-100%)}}@keyframes pillSlide{0%{transform:translateX(0)}50%{transform:translateX(15px)}}.bg-orb-1{animation:floatPulse1 8s ease-in-out infinite}.bg-orb-2{animation:floatPulse2 10s ease-in-out infinite}.controller-art{animation:controllerFloat 6s ease-in-out infinite}.animated-pill{animation:pillSlide 5s ease-in-out infinite}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:900;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:18px;fill:#a0aec0}.badge-text{font-weight:700;font-size:12px;fill:#fff;letter-spacing:1px}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g opacity=".15"><path stroke="#4facfe" stroke-width="1" d="M0,180 H1200 M0,220 H1200 M0,260 H1200 M0,300 H1200 M0,340 H1200"/><path stroke="#4facfe" stroke-width="1" d="M150,180 L0,360 M300,180 L150,360 M450,180 L350,360 M600,180 L600,360 M750,180 L850,360 M900,180 L1050,360 M1050,180 L1200,360"/></g><circle cx="200" cy="100" r="140" fill="#7f00ff" class="bg-orb-1" filter="url(#glowPink)" opacity=".4"/><circle cx="950" cy="160" r="160" fill="#00f2fe" class="bg-orb-2" filter="url(#glowCyan)" opacity=".3"/><circle cx="600" cy="280" r="100" fill="#ff0844" class="bg-orb-1" filter="url(#glowPink)" opacity=".2"/><g class="animated-pill" opacity=".4"><rect width="130" height="28" x="820" y="45" fill="none" stroke="#00f2fe" stroke-width="1.5" rx="14"/><rect width="90" height="28" x="965" y="45" fill="none" stroke="#ff0844" stroke-width="1.5" rx="14"/></g><g class="controller-art" transform="translate(850, 110)"><rect width="260" height="150" x="0" y="0" fill="#181335" stroke="#3b3267" stroke-width="3" opacity=".9" rx="40"/><path fill="#4facfe" d="M60,50 h15 v15 h15 v15 h-15 v15 h-15 v-15 h-15 v-15 h15 z" opacity=".8"/><circle cx="185" cy="50" r="8" fill="#ff0844" opacity=".9"/><circle cx="205" cy="68" r="8" fill="#00f2fe" opacity=".9"/><circle cx="165" cy="68" r="8" fill="#ffb199" opacity=".9"/><circle cx="185" cy="86" r="8" fill="#7f00ff" opacity=".9"/><circle cx="95" cy="100" r="18" fill="#251d4a" stroke="#00f2fe" stroke-width="2"/><circle cx="150" cy="100" r="18" fill="#251d4a" stroke="#ff0844" stroke-width="2"/><rect width="40" height="6" x="110" y="35" fill="url(#cyanPurple)" filter="url(#glowCyan)" rx="3"/></g><g><g transform="translate(80, 0) translate(0, 75)"><rect width="220" height="30" x="0" y="0" fill="url(#purpleGlow)" opacity=".9" rx="15"/><text x="110" y="19" class="badge-text" text-anchor="middle">CURATED ECOSYSTEM</text></g><g><text x="0" y="0" fill="#000" class="title-text" opacity=".7" transform="translate(80, 0) translate(0, 150) translate(2, 2)">Awesome Gaming Console OS</text><text x="0" y="0" class="title-text" transform="translate(80, 0) translate(0, 150)">Awesome Gaming Console OS</text></g><g><text x="0" y="0" class="subtitle-text" transform="translate(80, 0) translate(0, 195)">Proprietary &amp; Open-Source Operating Systems for PC Handhelds,</text><text x="0" y="26" class="subtitle-text" transform="translate(80, 0) translate(0, 195)">Retro Emulation Consoles &amp; Living Room Gaming Setups.</text></g><g><g transform="translate(80, 0) translate(0, 260) translate(0, 0)"><rect width="160" height="32" x="0" y="0" fill="#1e183a" stroke="#00f2fe" stroke-width="1.5" rx="8"/><circle cx="16" cy="16" r="5" fill="#00f2fe"/><text x="30" y="21" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SteamOS &amp; Bazzite</text></g><g transform="translate(80, 0) translate(0, 260) translate(172, 0)"><rect width="160" height="32" x="0" y="0" fill="#1e183a" stroke="#ff0844" stroke-width="1.5" rx="8"/><circle cx="16" cy="16" r="5" fill="#ff0844"/><text x="30" y="21" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Retro &amp; Emulation</text></g><g transform="translate(80, 0) translate(0, 260) translate(344, 0)"><rect width="160" height="32" x="0" y="0" fill="#1e183a" stroke="#e100ff" stroke-width="1.5" rx="8"/><circle cx="16" cy="16" r="5" fill="#e100ff"/><text x="30" y="21" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Handheld PC &amp; TV</text></g></g></g></svg>