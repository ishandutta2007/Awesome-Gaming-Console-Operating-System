<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#15102a" />
      <stop offset="100%" stop-color="#06040a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Animated elements in background */
      @keyframes floatPulse1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        50% { transform: translate(30px, -20px) scale(1.1); opacity: 0.6; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      }

      @keyframes floatPulse2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.25; }
        50% { transform: translate(-25px, 25px) scale(1.15); opacity: 0.55; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
      }

      @keyframes gridSlide {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }

      @keyframes controllerFloat {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      @keyframes pillSlide {
        0% { transform: translateX(0); }
        50% { transform: translateX(15px); }
        100% { transform: translateX(0); }
      }

      .bg-orb-1 { animation: floatPulse1 8s ease-in-out infinite; }
      .bg-orb-2 { animation: floatPulse2 10s ease-in-out infinite; }
      .controller-art { animation: controllerFloat 6s ease-in-out infinite; }
      .moving-grid { animation: gridSlide 3s linear infinite; }
      .animated-pill { animation: pillSlide 5s ease-in-out infinite; }

      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }

      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #a0aec0;
      }

      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        fill: #ffffff;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Perspective Lines (Retro Wave / Cyberpunk Vibe) -->
  <g opacity="0.15">
    <path d="M0,180 H1200 M0,220 H1200 M0,260 H1200 M0,300 H1200 M0,340 H1200" stroke="#4facfe" stroke-width="1" />
    <path d="M150,180 L0,360 M300,180 L150,360 M450,180 L350,360 M600,180 L600,360 M750,180 L850,360 M900,180 L1050,360 M1050,180 L1200,360" stroke="#4facfe" stroke-width="1" />
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (behind text) -->
  <!-- Glowing Orbs -->
  <circle class="bg-orb-1" cx="200" cy="100" r="140" fill="#7f00ff" filter="url(#glowPink)" opacity="0.4" />
  <circle class="bg-orb-2" cx="950" cy="160" r="160" fill="#00f2fe" filter="url(#glowCyan)" opacity="0.3" />
  <circle class="bg-orb-1" cx="600" cy="280" r="100" fill="#ff0844" filter="url(#glowPink)" opacity="0.2" />

  <!-- Animated Decorative Pills in Far Background -->
  <g class="animated-pill" opacity="0.4">
    <rect x="820" y="45" width="130" height="28" rx="14" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <rect x="965" y="45" width="90" height="28" rx="14" fill="none" stroke="#ff0844" stroke-width="1.5" />
  </g>

  <!-- CONTROLLER ARTWORK (Right Side Graphic Element) -->
  <g class="controller-art" transform="translate(850, 110)">
    <!-- Controller Body Silhouette -->
    <rect x="0" y="0" width="260" height="150" rx="40" fill="#181335" stroke="#3b3267" stroke-width="3" opacity="0.9" />
    <!-- Left D-Pad -->
    <path d="M60,50 h15 v15 h15 v15 h-15 v15 h-15 v-15 h-15 v-15 h15 z" fill="#4facfe" opacity="0.8" />
    <!-- Right Action Buttons -->
    <circle cx="185" cy="50" r="8" fill="#ff0844" opacity="0.9" />
    <circle cx="205" cy="68" r="8" fill="#00f2fe" opacity="0.9" />
    <circle cx="165" cy="68" r="8" fill="#ffb199" opacity="0.9" />
    <circle cx="185" cy="86" r="8" fill="#7f00ff" opacity="0.9" />
    <!-- Thumbsticks -->
    <circle cx="95" cy="100" r="18" fill="#251d4a" stroke="#00f2fe" stroke-width="2" />
    <circle cx="150" cy="100" r="18" fill="#251d4a" stroke="#ff0844" stroke-width="2" />
    <!-- Center Light Bar -->
    <rect x="110" y="35" width="40" height="6" rx="3" fill="url(#cyanPurple)" filter="url(#glowCyan)" />
  </g>

  <!-- FOREGROUND CONTENT: Badge, Title & Subtitle (Guaranteed Top Layer, Readable) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="url(#purpleGlow)" opacity="0.9" />
      <text x="110" y="19" text-anchor="middle" class="badge-text">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradient & Glow) -->
    <g transform="translate(0, 150)">
      <!-- Drop Shadow / Glow effect for maximum legibility -->
      <text x="0" y="0" class="title-text" fill="#000" opacity="0.7" transform="translate(2, 2)">Awesome Gaming Console OS</text>
      <text x="0" y="0" class="title-text">Awesome Gaming Console OS</text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" class="subtitle-text">
        Proprietary &amp; Open-Source Operating Systems for PC Handhelds,
      </text>
      <text x="0" y="26" class="subtitle-text">
        Retro Emulation Consoles &amp; Living Room Gaming Setups.
      </text>
    </g>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: SteamOS & Bazzite -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e183a" stroke="#00f2fe" stroke-width="1.5" />
        <circle cx="16" cy="16" r="5" fill="#00f2fe" />
        <text x="30" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">SteamOS &amp; Bazzite</text>
      </g>
      
      <!-- Pill 2: Retro Gaming -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e183a" stroke="#ff0844" stroke-width="1.5" />
        <circle cx="16" cy="16" r="5" fill="#ff0844" />
        <text x="30" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Retro &amp; Emulation</text>
      </g>

      <!-- Pill 3: Handheld PCs -->
      <g transform="translate(344, 0)">
        <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e183a" stroke="#e100ff" stroke-width="1.5" />
        <circle cx="16" cy="16" r="5" fill="#e100ff" />
        <text x="30" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Handheld PC &amp; TV</text>
      </g>
    </g>

  </g>
</svg>
